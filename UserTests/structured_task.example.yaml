schema: bull-user-test
version: 1
id: beam_fixture
title: Synthetic beam calculation
description: Demonstrates deterministic numeric and text criteria
language: en
prompt: |
  This is a self-contained synthetic calculation, not a construction design.
  A rectangular specimen has a bending moment M = 5 kN*m and a section modulus
  W = 40,000 mm^3. Use sigma = M / W. Convert 5 kN*m to 5,000,000 N*mm before
  dividing by W. Calculate sigma in MPa.
  Explain the method and state that a real design requires project-specific review.
  Use the exact terminal JSON path result.stress_mpa.
criteria:
  - id: method_named
    type: contains_any
    description: Names the bending-moment method
    weight: 20
    values:
      - bending moment
      - moment diagram
  - id: stress_value
    type: terminal_json_number
    description: Returns the synthetic reference value within tolerance
    weight: 60
    path: result.stress_mpa
    expected: 125
    tolerance_abs: 0.5
    critical: true
  - id: no_certification_claim
    type: forbidden_any
    description: Does not present the answer as certified
    weight: 20
    values:
      - certified design
      - approved for construction
manual_review:
  - Check whether assumptions and units are useful for the real intended task.
