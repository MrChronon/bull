name: Bug report
description: Report a reproducible BULL Client, Benchmark Lab, installer or server failure
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve BULL. English and Russian are welcome.
        **Do not attach private keys, connection stores, tokens, raw private prompts or unreviewed logs.**
  - type: input
    id: version
    attributes:
      label: BULL version
      placeholder: v0.24.0.0
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - LLM Client
        - Benchmark Lab
        - Agent Lab
        - GPU Lab
        - Server node / SSH
        - Installer / launcher
        - Report or artifact
        - Documentation
    validations:
      required: true
  - type: dropdown
    id: route
    attributes:
      label: Connection mode
      options:
        - Local model on this computer
        - LAN
        - SSH tunnel over the Internet
        - AllInOne
        - Not connection-related
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Minimal reproduction
      description: List the shortest repeatable sequence. Replace private values with placeholders.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows, Python, backend, model runtime and installation method. Do not include public IPs, usernames or key paths.
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Paste the smallest relevant excerpt. Prefer text over screenshots; never upload the full client_debug.log without review.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed keys, tokens, addresses, personal paths, private prompts and model responses from this report.
          required: true
