name: Bug report / Ошибка
description: Reproducible failure / Воспроизводимый сбой BULL, установки, подключения или отчёта
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve BULL. English and Russian are welcome.
        **Do not attach private keys, connection stores, tokens, raw private prompts or unreviewed logs.**
        Можно писать по-русски. Не прикладывайте ключи, токены, connection store, приватные prompts/ответы и непроверенные логи.
  - type: input
    id: version
    attributes:
      label: BULL version / Версия BULL
      placeholder: v0.29.0.1
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component / Компонент
      options:
        - LLM Client / Чат
        - Benchmark Lab / Тестирование
        - Agent Lab / Agent Benchmark
        - Test packs / Наборы и мастерская
        - Connection / Подключение и SSH
        - Installer / Установщик и launcher
        - Reports / Отчёты и artifacts
        - Documentation / Документация
    validations:
      required: true
  - type: dropdown
    id: route
    attributes:
      label: Connection mode / Тип соединения
      options:
        - Local / Этот компьютер
        - LAN / Локальная сеть
        - SSH tunnel / SSH через Интернет
        - Not connection-related / Не связано с подключением
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Minimal reproduction / Шаги воспроизведения
      description: Shortest repeatable sequence; replace private values / Краткие шаги без личных данных.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / Ожидаемый результат
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Observed behavior / Фактический результат
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment / Окружение
      description: Windows, Python, backend, installation; no IPs, usernames or key paths / Версии и установка без адресов, пользователей и путей ключей.
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence / Обезличенный пример
      description: Minimal excerpt; never upload unreviewed client_debug.log / Минимальный фрагмент, не полный непроверенный лог.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check / Проверка приватности
      options:
        - label: I removed secrets, addresses, personal paths and private content / Удалены секреты, адреса, личные пути и приватное содержимое.
          required: true
