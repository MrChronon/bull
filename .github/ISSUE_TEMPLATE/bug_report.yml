name: Ошибка программы
description: Воспроизводимый сбой BULL Client, Benchmark Lab, installer или Server node
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Не прикладывайте private key, connection store, токены или необработанные логи с личными данными.
  - type: input
    id: version
    attributes:
      label: Версия
      placeholder: v0.22.0.0
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Компонент
      options:
        - Client
        - Benchmark Lab
        - Server node
        - Installer
        - Release package
        - Documentation
    validations:
      required: true
  - type: dropdown
    id: route
    attributes:
      label: Схема подключения
      options:
        - Локальная модель на этом компьютере
        - LAN
        - Overlay VPN (Tailscale/WireGuard)
        - Direct SSH через Интернет
        - Не относится к подключению
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      description: Укажите минимальную последовательность действий и команд без секретов.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый результат
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактический результат
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Окружение
      description: Windows/Python/backend и способ установки. Не указывайте публичный IP, username и пути к ключам.
  - type: checkboxes
    id: privacy
    attributes:
      label: Безопасность данных
      options:
        - label: Я проверил вложения и удалил ключи, токены, адреса, личные пути, промпты и ответы моделей.
          required: true
