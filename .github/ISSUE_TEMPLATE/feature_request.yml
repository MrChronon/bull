name: Feature request / Предложение
description: Scoped improvement / Конкретное улучшение BULL
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Start with the user problem and desired outcome. For open-ended ideas or methodology debates, use GitHub Discussions first.
        Начните со сценария и результата. Общие идеи и методику сначала обсуждаем в Discussions.
  - type: dropdown
    id: component
    attributes:
      label: Area / Раздел
      options:
        - LLM Client / Чат
        - Benchmark Lab / Тестирование
        - Agent Lab / Agent Benchmark
        - Test packs / Наборы и мастерская
        - Connection / Удалённое подключение
        - Installer / Установка и обновление
        - Interface / Интерфейс и доступность
        - Reports / Отчёты
        - Documentation / Документация
        - Other / Другое
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or user scenario / Проблема и сценарий
      description: Explain the workflow, not only a button / Опишите задачу и затруднение, не только кнопку.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / Предлагаемое поведение
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and constraints / Альтернативы и ограничения
  - type: textarea
    id: success
    attributes:
      label: Success criterion / Критерий приёмки
      description: Suggest an observable result / Как проверить результат?
  - type: checkboxes
    id: compatibility
    attributes:
      label: Compatibility review / Совместимость
      options:
        - label: I described prompt/scorer/runtime, schema, historical or security impact / Описано влияние на prompts, scorers, runtime, schemas, историю и безопасность.
          required: true
