name: Feature request
description: Propose a scoped improvement to BULL
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Start with the user problem and desired outcome. For open-ended ideas or methodology debates, use GitHub Discussions first.
  - type: dropdown
    id: component
    attributes:
      label: Area
      options:
        - LLM Client
        - Benchmark Lab
        - Agent Lab
        - GPU Lab
        - Server / remote access
        - Installer / update
        - Interface / accessibility
        - Reports / visualization
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or user scenario
      description: Describe the workflow and friction, not only the desired button.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and constraints
  - type: textarea
    id: success
    attributes:
      label: How would we know it works?
      description: Suggest an observable acceptance criterion.
  - type: checkboxes
    id: compatibility
    attributes:
      label: Compatibility review
      options:
        - label: I noted whether this affects benchmark prompts, scorers, runtime, schemas, historical results or security.
          required: true
