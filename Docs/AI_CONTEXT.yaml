v0_27_release:
  name: BULL Simple Experience
  version: v0.27.0.1
  status: published
  feature_release: v0.27.0.0
  visual_patch: v0.27.0.1
  scope: terminal usability, user-owned tasks, decision support, and report access
  main_navigation:
    - Compare models
    - Chat with a model
    - Connection
    - More
  progressive_disclosure:
    more: [saved results, language and appearance, saved session status, help, exact commands, experiments]
    experimental: [Agent Benchmark, GPU Lab, advanced engine and server tools]
    server_setup_on_primary_path: false
  branding:
    startup: full-colour bounded Chafa asset
    pages: same canonical Chafa geometry and expanded BULL name on every ui_header
  page_transition: ui_header clears the previous terminal page before drawing
  connections:
    visible_groups: [this computer, remote server, tools]
    remote_paths: [saved server, SSH alias, manual server]
    tools: [import or migrate, help or explicit diagnostics]
    implicit_diagnostics: false
  offline_status:
    live_telemetry_request: false
    saved_values_labelled_as_saved: true
  user_tests:
    directory: UserTests
    guide: Docs/en/BENCHMARKS.md and Docs/ru/BENCHMARKS.md
    module: Shared/bull_llm/user_tests.py
    formats:
      txt: prompt-only; runtime plus manual review; no automatic quality score
      yaml: bull-user-test version 1; safe bounded data-only subset
    criteria: [contains_all, contains_any, forbidden_any, word_count, terminal_json_equals, terminal_json_number]
    weights: exactly 100
    critical_failure_cap: 0.59
    manual_review_numeric_weight: none
    forbidden_features: [code execution, shell, YAML tags, anchors, aliases, regex]
    scorer: user_contract_v2 for newly discovered YAML; user_contract_v1 preserved for historical artifacts
    strict_terminal_json: true for user_contract_v2
    json_boolean_numeric_equivalence: forbidden for user_contract_v2
    one_word_phrase_matching: Unicode word boundaries for user_contract_v2
    tests: Tests/user_tests_regression.py
  decision_support:
    module: Shared/bull_llm/decision_support.py
    inputs: existing Native quality, warm speed, task completion, and VRAM metrics
    mutates_quality_score: false
    profiles: [quality, speed, balance, low_memory, custom]
    speed_quality_gate: native quality >= max(0.60, best minus 0.10); task completion >= 0.80 when known
    quality_labels: observed Native mean and conservative lower CI are separate fields
    tie_policy: equal decision utility returns equal candidates; model name is display order only
    scope: relative within one comparable run; never a universal leaderboard
    outputs: [terminal markers, terminal quality-speed map, offline HTML cards and scatter]
    tests: Tests/decision_support_regression.py
  result_access:
    terminal_summary: true
    custom_priorities: true
    offline_html: true
    summary_json: true
    share_safe_evidence: preferred JSON for sharing
    raw_json: private; may contain prompts and answers
  measurement_freeze:
    built_in_prompts: unchanged
    built_in_scorers: unchanged
    recovery_pipeline: unchanged
    inference_runtime: unchanged
  postponed: BULL Local System Matrix T5.2

planned_roadmap:
  source: Docs/BULL_TRANSITION_ROADMAP.md
  revision: '1.2'
  approved_on: '2026-10-03'
  scope: approved priorities and acceptance criteria; U1 is released, later stages are not implemented features
  product_goal: help users choose installed models for their own tasks using trustworthy quality and timing evidence
  interface: terminal first; reuse the existing four-action Home
  delivery_order: [U1, U2, reliable_runs, P1]
  stages:
    U1:
      name: BULL Clear Choice
      target_version: v0.28.0.7
      status: released
      priorities:
        - correct tied recommendations and distinguish native mean from conservative decision values
        - show decision cards first in terminal and HTML with shared data and explicit gate policy
        - distinguish unqualified speed from insufficient data and never infer missing VRAM
        - label task latency generation speed and measured cold warm or unknown state separately
        - version YAML scorer corrections independently of prompt and runtime changes
        - provide self-contained extraction structured-output and translation templates with manual semantic review
        - exclude templates from discovery until the user creates a task copy
        - keep task preparation and reports available offline and allow single-model evaluation
        - improve Python preflight portable launch and optional shortcuts using the existing installer
        - provide colleague HTML and share-safe JSON export with model-label preview
        - enforce code-execution capabilities across menus commands and standalone entrypoints
        - verify concurrent-resume exclusion completed-record preservation and clear paused state
      acceptance:
        - tied metrics do not produce a winner chosen by model name
        - recommendation reasons and limitations match between terminal and HTML
        - strict JSON claims have explicit type and terminal-boundary checks
        - substring checks are not presented as semantic or linguistic evaluation
        - new users can create a task compare models and export without expert menus
        - startup regression duration is measured before deciding on startup-gate changes
      open_findings_from_v0_27_0_1: []
      resolved_in_development:
        - equal decision utilities now return equal candidates rather than model-name tie breakers
        - observed Native mean and conservative lower CI are now separate decision-support fields
        - user_contract_v2 keeps JSON booleans distinct from numbers and requires a terminal JSON boundary
        - user_contract_v2 matches one-word literal criteria at Unicode word boundaries; it is not a semantic-language scorer
        - bundled user-test examples are self-contained synthetic extraction calculation and translation tasks excluded from discovery
      change_policy: separate scorer template report installer permissions and orchestration PRs; never silently rescore old artifacts
    U2:
      name: BULL Quick Compare
      target_version: v0.28.1.0
      status: planned
      depends_on: [U1]
      candidate_pack: bull_choose@1.0.0
      target_case_count: '5-8'
      modes: [quick_overview, confirm_result]
      language_coverage: explicit versioned EN and RU variants; no assumed score equivalence
      runtime_budget: '8-15 minutes is a target on a declared 2-3-model setup, not a universal guarantee'
      acceptance:
        - validate inspect manifest lock and gold fixtures before inference
        - preserve bull_chat_core@1.0.0 content and hashes
        - declare the same planned comparison coverage before execution
        - incomplete or single-seed runs cannot imply proven ranking stability
        - compare short and confirmatory runs before promoting the pack to default
    reliable_runs:
      name: BULL Reliable Runs
      target_version: TBD
      status: planned
      architecture_stages: [T5.3, T5.2]
      scope: full resilience coverage followed by hardware comparability and additional measurements
      minimum_reliability_gate: U1
      delivery: separate fault-injection and hardware-metric changes
      acceptance: live local SSH disconnect restart and observed-placement evidence supplements mocks
    P1:
      name: BULL Anywhere
      target_version: TBD
      status: planned
      prerequisite: extract production backend and transport through existing BackendAdapter contracts
      initial_scope: [Linux client, macOS client, chat, compare, UserTests, local reports, HTTP, pinned SSH]
      excluded: [GPU Lab parity, Windows installer parity, server OS deployment, implicit MLX equivalence]
      controls_preserved: [SSH pinning, no untrusted ProxyCommand, data-only packs, offline-first]
      acceptance: separate Unix CI and documented live client-server matrix; no certified label without validation
      scheduling: may precede full T5.2 when supported by user demand; does not displace U1 correctness
  later_stages:
    T6: Field Lab after isolated executor foundation; version TBD
    T7: Open Range SDK and external adapters; version TBD
    T8: BULL One v1.0.0 after the existing stability and release gates
  product_validation:
    external_telemetry: false
    method: manual clean-machine protocol with installation startup setup and inference timed separately
    usability_target: at least four of five new users explain the recommendation and its limitation
    conditions: two installed models; no user guide or expert menu needed for the primary scenario
    excluded_success_proxies: [test count alone, GitHub stars, pack count]
  deferred: [GUI, hosted leaderboard, marketplace, branding redesign, automatic model downloads]
  implementation_or_publication_completed_by_this_plan: false
